name: Build agent feed and deploy Pages

# Requires Settings → Pages → Source = "GitHub Actions".
# Nothing is committed: the feed is generated at deploy time, so this never
# races the desk routine's own pushes to main.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write # pushes the Jev paper-trading ledger to the `ledger` branch (never to main)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://benngaihk.github.io/kairos-desk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build feed (fall back to the last published feed on failure)
        env:
          PAID_API_BASE: ${{ vars.PAID_API_BASE }}
          MAX_EVENTS: ${{ vars.MAX_EVENTS || '300' }}
        run: |
          if ! node scripts/build-feed.mjs --out docs/v1; then
            echo "::warning::feed build failed; republishing the previous feed"
            mkdir -p docs/v1
            for f in index markets top sets changes proof jev; do
              curl -fsS "$SITE_URL/v1/$f.json" -o "docs/v1/$f.json" || true
            done
          fi
      - name: Jev paper-trading ledger (runs only if the TYPESAFE_API_KEY secret exists)
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MAX: ${{ vars.JEV_MAX || '30' }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then echo "no TYPESAFE_API_KEY; skipping"; exit 0; fi
          [ -f docs/v1/markets.json ] || { echo "no feed; skipping"; exit 0; }
          # Only start a new ledger if the branch is definitely absent (exit 2); any other error aborts.
          set +e; git ls-remote --exit-code --heads origin ledger >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then
            git fetch --depth=1 origin ledger:ledger
            git worktree add ledger ledger
          elif [ $rc -eq 2 ]; then
            git worktree add --orphan -b ledger ledger
          else
            echo "::warning::cannot read ledger branch (rc=$rc); skipping"; exit 0
          fi
          node scripts/jev-run.mjs --feed docs/v1 --ledger ledger/jev-ledger.json --public docs/v1/jev.json
          cd ledger
          git config user.name "kairos-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jev-ledger.json
          if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
          git commit -q -m "Jev ledger $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin ledger
      - name: Keep the last published Jev ledger view if this run produced none
        run: '[ -f docs/v1/jev.json ] || curl -fsS "$SITE_URL/v1/jev.json" -o docs/v1/jev.json || true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
